name: Build Panoptes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-debug:
    name: Build Debug
    runs-on: [self-hosted, DESKTOP-N792BI5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake (Debug)
        run: cmake --preset debug -DBUILD_DOC=OFF -DBUILD_DRIVER=ON -DBUILD_WIX_INSTALLER=OFF -DBUILD_GRPC=ON
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          CMAKE_GENERATOR: "Visual Studio 17 2022"

      - name: Build (Debug)
        run: msbuild build/debug/Panoptes.sln /p:Configuration=Debug /p:Platform=x64 /m

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panoptes-debug
          path: |
            bin/Debug/**/*.dll
            bin/Debug/**/*.exe
            bin/Debug/**/*.pdb
            bin/tests/Debug/**/*.exe
            bin/tests/Debug/**/*.pdb
          if-no-files-found: warn

  build-release:
    name: Build Release
    runs-on: [self-hosted, DESKTOP-N792BI5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake (Release)
        run: cmake --preset release -DBUILD_DOC=OFF -DBUILD_DRIVER=ON -DBUILD_WIX_INSTALLER=OFF -DBUILD_GRPC=ON
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          CMAKE_GENERATOR: "Visual Studio 17 2022"

      - name: Build (Release)
        run: msbuild build/release/Panoptes.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panoptes-release
          path: |
            bin/Release/**/*.dll
            bin/Release/**/*.exe
            bin/Release/**/*.pdb
            bin/tests/Release/**/*.exe
            bin/tests/Release/**/*.pdb
          if-no-files-found: warn
