name: Build Panoptes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: [self-hosted, DESKTOP-N792BI5]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake (Debug)
        run: cmake --preset debug -DBUILD_DOC=OFF -DBUILD_DRIVER=ON -DBUILD_WIX_INSTALLER=OFF -DBUILD_GRPC=ON
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build (Debug)
        run: msbuild build/debug/Panoptes.sln /p:Configuration=Debug /p:Platform=x64 /m

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panoptes-debug
          path: |
            build/debug/**/*.dll
            build/debug/**/*.exe
            build/debug/**/*.pdb
          if-no-files-found: warn
